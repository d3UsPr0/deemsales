<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEEM Sales - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --primary: #540b02;
            --secondary: #00b652;
            --accent: #f7941d;
        }
        
        * { box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, var(--primary), #8b1a0a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 20px;
        }
        
        .login-container {
            width: 100%;
            max-width: 380px;
        }
        
        .login-card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .login-header {
            background-color: var(--primary);
            color: white;
            padding: 20px 25px 18px;
            text-align: center;
        }
        
        .login-header .icon {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-header .icon img {
            max-height: 80px;
            max-width: 100%;
            object-fit: contain;
        }
        
        .login-header h4 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        
        .login-header h4 span {
            color: var(--accent);
        }
        
        .login-header p {
            margin: 4px 0 0;
            font-size: 11.5px;
            opacity: 0.85;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        
        .login-body {
            padding: 22px 25px 20px;
        }
        
        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: #444;
            margin-bottom: 5px;
        }
        
        .form-control {
            font-size: 13.5px;
            padding: 9px 12px;
            border: 1.5px solid #e0e0e0;
            transition: all 0.2s;
        }
        
        .form-control:focus {
    border-color: #e0e0e0;
    box-shadow: none;
}
        
        .input-group-text {
            background-color: var(--primary);
            color: white;
            border: 1.5px solid var(--primary);
            border-radius: 8px 0 0 8px;
            font-size: 13px;
            padding: 9px 12px;
        }
        
        .input-group .form-control {
    border-left: none;
    border-radius: 0;
    border-right: 1.5px solid #e0e0e0;
}

/* Username field: no eye toggle after it, so it needs rounded right corners */
.input-group:not(.with-eye) .form-control {
    border-radius: 0 8px 8px 0;
}

/* Password field: eye toggle after it, so rounded corners come from the toggle */
.input-group.with-eye .form-control {
    border-radius: 0;
}
        
        .input-group.with-eye .form-control {
            border-right: none;
        }
        
        .input-group:focus-within .input-group-text {
    background-color: var(--accent);
    border-color: var(--accent);
}
        
        .password-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            cursor: pointer;
            color: #888;
            font-size: 13px;
            transition: color 0.2s;
            background: transparent;
            border: 1.5px solid #e0e0e0;
            border-left: none;
            border-radius: 0 8px 8px 0;
        }
        
        .password-toggle:hover {
            color: var(--primary);
        }
        
        .password-toggle i {
            font-size: 13px;
            line-height: 1;
            display: block;
        }
        
        .btn-login {
            background-color: var(--secondary);
            border: none;
            padding: 10px;
            font-size: 13.5px;
            font-weight: 700;
            border-radius: 8px;
            letter-spacing: 0.3px;
            transition: all 0.2s;
        }
        
        .btn-login:hover {
            background-color: #009a46;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 182, 82, 0.35);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .alert {
            font-size: 12.5px;
            padding: 8px 36px 8px 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            position: relative;
            display: flex;
            align-items: center;
            min-height: 36px;
            line-height: 1.35;
        }
        
        .alert .btn-close {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 10px;
            margin: auto;
            width: 14px;
            height: 14px;
            padding: 0;
            background-size: 10px;
            opacity: 0.6;
        }
        
        .login-footer {
            text-align: center;
            padding: 0 25px 18px;
            font-size: 11px;
            color: #999;
        }
        
        .login-footer i {
            color: var(--accent);
        }
        
        .form-group {
            margin-bottom: 14px;
        }
        
        @media (max-width: 480px) {
    body {
        padding: 10px;
        align-items: flex-start;
        padding-top: 40px;
    }
    
    .login-container {
        max-width: 100%;
    }
    
    .login-header {
        padding: 16px 18px 14px;
    }
    
    .login-header .icon img {
        max-height: 40px;
    }
    
    .login-header h4 {
        font-size: 18px;
    }
    
    .login-body {
        padding: 16px 18px 14px;
    }
    
    .login-footer {
        padding: 0 18px 14px;
    }
}
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="icon">
                    <img src="{% static 'images/deem_logo.png' %}" alt="DEEM Logo">
                </div>
                <h4>DEEM <span>Sales</span></h4>
                <p>Order Management System</p>
            </div>
            <div class="login-body">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label for="username" class="form-label">
                            <i class="fas fa-user" style="color: var(--primary);"></i> Username
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" 
                                   class="form-control" 
                                   id="username" 
                                   name="username" 
                                   placeholder="Enter username"
                                   required 
                                   autofocus>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock" style="color: var(--primary);"></i> Password
                        </label>
                        <div class="input-group with-eye">
                            <span class="input-group-text">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" 
                                   class="form-control" 
                                   id="password" 
                                   name="password" 
                                   placeholder="Enter password"
                                   required>
                            <span class="password-toggle" id="togglePassword" title="Show password">
                                <i class="fas fa-eye" id="toggleIcon"></i>
                            </span>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-login w-100 mt-2">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                </form>
            </div>
            <div class="login-footer">
                <i class="fas fa-shield-alt"></i> 
                DEEM Restaurant &copy; {% now "Y" %}
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePassword');
        const toggleIcon = document.getElementById('toggleIcon');
        
        toggleBtn.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
                toggleBtn.title = 'Hide password';
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
                toggleBtn.title = 'Show password';
            }
            passwordInput.focus();
        });
    });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
